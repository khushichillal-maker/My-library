<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi ning — Curated Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #CFCAC1; }
    .serif { font-family: 'Instrument Serif', serif; }
    .book-shadow { box-shadow: 0 20px 40px -12px rgba(0,0,0,0.25); }
  </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-[1280px] mx-auto bg-[#FFFEF8] rounded-[28px] p-6 md:p-10 border border-black/5 min-h-[90vh]">
  <h1 class="serif text-[42px] leading-tight mb-2">Keep the story going...</h1>
  <p class="text-xs opacity-50 uppercase tracking-widest mb-8">Curated Private Archive</p>

  <!-- Books Grid -->
  <div id="libraryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
</div>

<!-- Simple PDF Reader / Viewer Overlay -->
<div id="viewerOverlay" class="fixed inset-0 bg-black/90 z-50 hidden flex-col">
  <div class="flex justify-between items-center px-6 py-4 bg-black text-white border-b border-white/10">
    <p id="viewerTitle" class="text-sm font-medium truncate max-w-[60%]"></p>
    <div class="flex gap-3">
      <a id="downloadBtn" download class="px-4 py-2 text-xs bg-white text-black rounded-full font-medium">DOWNLOAD PDF</a>
      <button onclick="closeViewer()" class="px-4 py-2 text-xs border border-white/30 rounded-full text-white">CLOSE ✕</button>
    </div>
  </div>
  <iframe id="pdfFrame" class="w-full flex-1 border-0 bg-white" src=""></iframe>
</div>

<script>
  // Add your PDF paths here (Hosted directly on your server or GitHub Pages)
  const myLibrary = [
    { id: '1', title: 'The Art of Thinking', url: 'books/art-of-thinking.pdf', cover: 'covers/art-of-thinking.jpg' },
    { id: '2', title: 'Selected Essays', url: 'books/selected-essays.pdf', cover: 'covers/selected-essays.jpg' }
  ];

  function renderLibrary() {
    const grid = document.getElementById('libraryGrid');
    grid.innerHTML = myLibrary.map(book => `
      <div class="flex flex-col gap-2">
        <div onclick="openBook('${book.id}')" class="w-full aspect-[2/3] bg-neutral-200 rounded-lg overflow-hidden book-shadow cursor-pointer hover:opacity-90 transition">
          <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=PDF'">
        </div>
        <p class="text-xs font-semibold truncate mt-1">${book.title}</p>
        <div class="flex gap-2">
          <button onclick="openBook('${book.id}')" class="text-[10px] underline opacity-70">Read</button>
          <a href="${book.url}" download class="text-[10px] underline opacity-70">Download</a>
        </div>
      </div>
    `).join('');
  }

  function openBook(id) {
    const book = myLibrary.find(b => b.id === id);
    if (!book) return;
    document.getElementById('viewerTitle').innerText = book.title;
    document.getElementById('downloadBtn').href = book.url;
    
    // Native browser viewer (works reliably across desktop & modern mobile browsers)
    document.getElementById('pdfFrame').src = book.url;
    document.getElementById('viewerOverlay').classList.remove('hidden');
    document.getElementById('viewerOverlay').classList.add('flex');
  }

  function closeViewer() {
    document.getElementById('viewerOverlay').classList.add('hidden');
    document.getElementById('viewerOverlay').classList.remove('flex');
    document.getElementById('pdfFrame').src = '';
  }

  renderLibrary();
</script>
</body>
</html>
