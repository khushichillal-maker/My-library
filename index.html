<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story • 1GB Library</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#CFCAC1}
.serif{font-family:'Instrument Serif',serif}
.no-scrollbar::-webkit-scrollbar{display:none}
</style>
</head>
<body class="min-h-screen p-2 md:p-4">
<div class="max-w-[1280px] mx-auto bg-[#FFFEF8] rounded-[24px] min-h-[92vh] overflow-hidden">

<div class="flex justify-between items-center p-6 border-b border-black/5">
<div>
<h1 class="serif text-2xl">STORY • 1GB VAULT</h1>
<p class="text-[11px] opacity-60 mt-1" id="info">Loading storage...</p>
</div>
<label class="px-5 py-2.5 bg-[#121212] text-white rounded-full text-[13px] cursor-pointer hover:bg-[#FF4D4D]">
+ Upload PDF
<input type="file" id="pdfInput" accept=".pdf" hidden>
</label>
</div>

<div class="p-6">
<div id="bookRow" class="flex gap-5 overflow-x-auto no-scrollbar pb-6"></div>
<div id="empty" class="hidden text-center mt-20"><p class="text-5xl">📚</p><p class="serif text-2xl mt-4">Your 1GB vault is empty</p><p class="text-xs opacity-50 mt-2">Upload - saved forever on web for everyone</p></div>
</div>

</div>

<div id="reader" class="fixed inset-0 bg-black hidden flex-col z-[100]">
<div class="flex justify-between items-center p-3 text-white bg-black">
<button onclick="document.getElementById('reader').classList.add('hidden')" class="px-4 py-2 bg-white/10 rounded-full text-xs">✕ Close</button>
<span id="rTitle" class="text-xs truncate max-w-[50%]"></span>
<button onclick="deleteBook()" class="px-3 py-1 bg-red-500 rounded-full text-xs">Delete</button>
</div>
<iframe id="pdfFrame" class="flex-1 w-full bg-white"></iframe>
</div>

<script>
const SUPABASE_URL = 'https://tfxorxxpureczrkagceo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_omleBBag-h_xdc9eViE0JQ_NYdo03HU';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let curName='';

document.getElementById('pdfInput').addEventListener('change', async e=>{
 const file=e.target.files[0]; if(!file) return;
 if(file.size > 100*1024*1024){ alert('Max 100MB per PDF'); return; }
 const cleanName=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9.-]/g,'_');
 document.getElementById('info').innerText='Uploading...';
 const {error}=await supabaseClient.storage.from('books').upload(cleanName,file);
 if(error){ alert('Upload failed: '+error.message); loadBooks(); return; }
 loadBooks();
});

async function loadBooks(){
 const {data,error}=await supabaseClient.storage.from('books').list('',{limit:100, sortBy:{column:'created_at',order:'desc'}});
 if(error){ document.getElementById('info').innerText='Error: '+error.message; return; }

 let total=0;
 (data||[]).forEach(b=> total+=(b.metadata?.size||0));
 const used=(total/1024/1024).toFixed(1);
 const left=(1024-used).toFixed(1);
 document.getElementById('info').innerText=`${used} MB used / 1024 MB • ${left} MB left • ${data.length} books`;

 const row=document.getElementById('bookRow');
 const empty=document.getElementById('empty');
 row.innerHTML='';
 if(!data || data.length===0){ empty.classList.remove('hidden'); return; }
 empty.classList.add('hidden');

 data.forEach(b=>{
  if(b.name=='.emptyFolderPlaceholder') return;
  const {data:urlData}=supabaseClient.storage.from('books').getPublicUrl(b.name);
  const title=b.name.replace(/^[0-9]+_/,'').replace('.pdf','').slice(0,40);
  const size=((b.metadata?.size||0)/1024/1024).toFixed(1);
  row.innerHTML+=`
  <div onclick="openR('${urlData.publicUrl}','${b.name}')" class="min-w-[170px] cursor-pointer group">
    <div class="w-[170px] h-[240px] bg-[#121212] rounded-[12px] shadow-xl group-hover:-translate-y-1 transition flex flex-col justify-between p-4">
      <span class="text-[9px] bg-white text-black px-2 py-1 rounded-full w-fit font-bold">${size} MB</span>
      <div>
        <p class="text-white font-bold leading-tight text-[15px]">${title}</p>
        <p class="text-white/40 text-[10px] mt-2">PDF • Tap to read</p>
      </div>
    </div>
    <p class="text-[12px] font-medium mt-3 truncate w-[170px]">${title}</p>
  </div>`;
 });
}

function openR(url,name){
 curName=name;
 document.getElementById('pdfFrame').src=url;
 document.getElementById('rTitle').innerText=name.replace(/^[0-9]+_/,'');
 document.getElementById('reader').classList.remove('hidden');
 document.getElementById('reader').classList.add('flex');
}
async function deleteBook(){
 if(!confirm('Delete this PDF permanently from web?')) return;
 await supabaseClient.storage.from('books').remove([curName]);
 document.getElementById('reader').classList.add('hidden');
 loadBooks();
}

loadBooks();
</script>
</body>
</html>
