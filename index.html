<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi ning — Shared</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#CFCAC1}.serif{font-family:'Instrument Serif',serif}
.page{display:none}.page.active{display:block}.no-scrollbar::-webkit-scrollbar{display:none}
#loader{position:fixed;inset:0;background:#FFFEF8f0;z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column}
</style>
</head>
<body>
<div id="loader"><p class="serif text-2xl">Uploading to showcase...</p><p id="loaderText" class="text-[11px] opacity-60 mt-2">Please wait</p></div>

<div class="max-w-[1280px] mx-auto bg-[#FFFEF8] rounded-[28px] min-h-[90vh] mt-4 border overflow-hidden" id="appCard">
<div class="flex justify-between p-6 border-b">
<div class="bg-[#F6F3EE] px-4 py-2 rounded-full flex gap-2 items-center"><span class="text-[10px] opacity-30 tracking-widest">SEARCH</span><input id="searchInput" placeholder="Title..." class="bg-transparent outline-none text-sm w-[140px]"></div>
<div class="flex gap-2 items-center"><label class="px-5 py-2.5 bg-black text-white rounded-full text-[10px] cursor-pointer">UPLOAD<input type="file" id="pdfInput" accept=".pdf" multiple hidden></label><button onclick="toggleMenu()" class="w-9 h-9 rounded-full bg-black/5 flex items-center justify-center text-lg">≡</button></div>
</div>

<div id="menuDrawer" class="fixed inset-0 z-[100] hidden"><div class="absolute inset-0 bg-black/40" onclick="toggleMenu()"></div><div class="absolute right-0 top-0 h-full w-[300px] bg-[#FFFEF8] p-6"><button onclick="toggleMenu()" class="float-right border rounded-full px-3 py-1 text-[10px]">CLOSE</button><p id="stats" class="mt-16 text-xs opacity-60">Loading...</p><div class="mt-6 flex flex-col gap-2"><button onclick="goPage('all');toggleMenu()" class="text-left px-5 py-3 bg-black text-white rounded-full text-sm">All Books</button><button onclick="goPage('about');toggleMenu()" class="text-left px-5 py-3 border rounded-full text-sm">About Me</button></div><p class="mt-10 text-[10px] opacity-30">If shelf empty, your crudcrud expired. Get new link from crudcrud.com</p></div></div>

<div class="p-8">
<h1 class="serif text-[42px] leading-[0.9]">Keep the story<br>going..</h1>
<p class="text-[13px] opacity-60 mt-3 max-w-[340px] italic">Shared showcase — anyone with link sees your books</p>
<div id="page-all" class="page active mt-10"><div id="bookRow" class="flex gap-5 overflow-x-auto no-scrollbar pb-6"></div><div id="empty" class="border border-dashed p-12 text-center rounded-[20px]"><p class="serif text-xl">Your shelves are empty</p><p class="text-[11px] opacity-50">Upload first book</p></div></div>
<div id="page-about" class="page mt-10"><p class="serif text-2xl">Mi ning</p><p class="text-[13px] opacity-60 mt-3">Curator of dangerously well-read books.</p></div>
</div>
</div>

<div id="detailPage" class="fixed inset-0 hidden bg-[#FFFEF8] z-[120] p-8"><button onclick="closeDetail()" class="border rounded-full px-5 py-2 text-[11px]">CLOSE</button><h2 id="detailTitle" class="serif text-3xl mt-10"></h2><p id="detailMeta" class="text-xs opacity-50 mt-2"></p><button onclick="readNative()" class="mt-8 px-6 py-3 bg-black text-white rounded-full text-xs">READ</button><br><button onclick="deleteDetail()" class="mt-6 text-[11px] opacity-40">DELETE FOR EVERYONE</button></div>

<script>
// === REPLACE THIS WITH YOUR NEW LINK ===
const CRUD_BASE = "REPLACE_WITH_YOUR_NEW_LINK"; // e.g. https://crudcrud.com/api/0d192b0278264add91af3b6c367dbcb8
const BOOKS_ENDPOINT = CRUD_BASE + "/books";

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let books=[], selectedId=null;

function showLoader(t){document.getElementById('loader').style.display='flex'; document.getElementById('loaderText').innerText=t;}
function hideLoader(){document.getElementById('loader').style.display='none';}

async function genCover(file){
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument(buf).promise;
    const page=await pdf.getPage(1);
    const vp=page.getViewport({scale:0.4});
    const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    return c.toDataURL('image/jpeg',0.5);
  }catch{return null;}
}

async function uploadToTmpfiles(file){
  const fd=new FormData(); fd.append('file', file);
  const res=await fetch('https://tmpfiles.org/api/v1/upload',{method:'POST',body:fd});
  const json=await res.json();
  if(json.status!=='success') throw new Error('tmpfiles failed');
  // json.data.url = https://tmpfiles.org/dl/xxxx -> direct link
  let url=json.data.url;
  // convert to direct dl link
  url=url.replace('tmpfiles.org/','tmpfiles.org/dl/');
  return url;
}

async function loadBooks(){
  try{
    const res=await fetch(BOOKS_ENDPOINT);
    if(!res.ok) throw new Error('expired');
    books=await res.json();
    document.getElementById('stats').innerText=books.length+' books — live';
    renderAll();
  }catch(e){
    document.getElementById('stats').innerText='API expired — get new link from crudcrud.com';
    document.getElementById('bookRow').innerHTML=`<p class="text-xs text-red-500">Your API expired. Go to crudcrud.com, get new link, paste in code line 38, commit again.</p>`;
  }
}

document.getElementById('pdfInput').addEventListener('change', async e=>{
  const files=Array.from(e.target.files); if(!files.length) return;
  showLoader('Generating cover...');
  for(const f of files){
    try{
      const cover=await genCover(f);
      showLoader('Uploading PDF (tmpfiles)...');
      const pdf_url=await uploadToTmpfiles(f);
      showLoader('Saving to shared library...');
      const title=f.name.replace('.pdf','').slice(0,60);
      const r=await fetch(BOOKS_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,cover,pdf_url,size:f.size})});
      if(!r.ok) throw new Error('Crud expired');
    }catch(err){
      alert('Upload failed: '+err.message+'\n\nIf crud expired, get new link from crudcrud.com');
      hideLoader(); return;
    }
  }
  hideLoader(); await loadBooks();
});

function renderAll(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const filtered=books.filter(b=>b.title.toLowerCase().includes(q));
  const row=document.getElementById('bookRow'); row.innerHTML='';
  document.getElementById('empty').style.display=filtered.length?'none':'block';
  filtered.forEach(b=>{
    const id=b._id;
    const cover=b.cover?`<img src="${b.cover}" class="w-full h-full object-cover">`:`<div class="w-full h-full bg-black text-white p-3 text-[11px]">${b.title}</div>`;
    row.innerHTML+=`<div class="min-w-[140px]"><div onclick="openDetail('${id}')" class="w-[140px] h-[200px] rounded-[10px] overflow-hidden bg-white shadow cursor-pointer">${cover}</div><p class="text-[11px] mt-2 truncate w-[140px]">${b.title}</p><p class="text-[9px] opacity-40">${(b.size/1024/1024).toFixed(1)} MB</p></div>`;
  });
}
function toggleMenu(){document.getElementById('menuDrawer').classList.toggle('hidden');}
function goPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active')); document.getElementById('page-'+p).classList.add('active');}
function openDetail(id){selectedId=id; const b=books.find(x=>x._id==id); document.getElementById('detailTitle').innerText=b.title; document.getElementById('detailMeta').innerText=(b.size/1024/1024).toFixed(1)+' MB'; document.getElementById('detailPage').classList.remove('hidden'); window._pdf=b.pdf_url;}
function closeDetail(){document.getElementById('detailPage').classList.add('hidden');}
function readNative(){window.open(window._pdf,'_blank');}
async function deleteDetail(){if(!confirm('Delete for everyone?')) return; await fetch(BOOKS_ENDPOINT+'/'+selectedId,{method:'DELETE'}); closeDetail(); await loadBooks();}
document.getElementById('searchInput').addEventListener('input',renderAll);
loadBooks();
</script>
</body>
</html>
