<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi ning — Library</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#CFCAC1}
.serif{font-family:'Instrument Serif',serif}
.book-shadow{box-shadow:0 20px 40px -12px rgba(0,0,0,0.25)}
.no-scrollbar::-webkit-scrollbar{display:none}
.page{display:none}.page.active{display:block}
#loader{position:fixed;inset:0;background:rgba(255,254,248,0.96);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column}
#pdfViewer{position:fixed;inset:0;background:#121212;z-index:200;display:none;flex-direction:column}
</style>
</head>
<body>
<div id="loader"><p class="serif text-[28px]">Uploading...</p><p id="loaderText" class="text-[11px] tracking-widest opacity-50 mt-2">Please wait...</p></div>
<div id="pdfViewer"><div class="flex justify-between items-center p-4 bg-black text-white"><button onclick="closePdf()" class="px-5 py-2 rounded-full border border-white/20 text-[11px] tracking-widest">CLOSE</button><p id="pdfTitle" class="text-[12px] opacity-60 truncate max-w-[200px]"></p><button onclick="pdfZoom(0.2)" class="px-3 py-1 border border-white/20 rounded-full">+</button></div><div id="pdfContainer" class="flex-1 overflow-auto p-4 flex flex-col items-center gap-4"></div></div>

<div id="appCard" class="max-w-[1280px] mx-auto bg-[#FFFEF8] rounded-[28px] min-h-[92vh] overflow-hidden border border-black/5 mt-3 md:mt-6 relative">
<div class="flex justify-between items-center px-6 md:px-8 py-5 border-b border-black/5">
<div class="flex items-center gap-3 bg-[#F6F3EE] px-4 py-2.5 rounded-full w-[200px] md:w-[300px]"><span class="opacity-30 text-[11px] tracking-widest">SEARCH</span><input id="searchInput" placeholder="Title..." class="bg-transparent outline-none text-[13px] w-full"></div>
<div class="flex items-center gap-3"><label class="px-5 py-2.5 bg-[#121212] text-white rounded-full text-[11px] cursor-pointer tracking-widest">UPLOAD<input type="file" id="pdfInput" accept=".pdf" multiple hidden></label><button onclick="toggleMenu()" class="w-9 h-9 rounded-full bg-black/5 flex items-center justify-center text-[18px]">≡</button></div>
</div>
<div id="menuDrawer" class="fixed inset-0 z-[100] hidden"><div class="absolute inset-0 bg-black/40" onclick="toggleMenu()"></div><div class="absolute right-0 top-0 h-full w-[320px] bg-[#FFFEF8] p-7 flex flex-col"><button onclick="toggleMenu()" class="self-end w-8 h-8 rounded-full border flex items-center justify-center text-[11px]">CLOSE</button><p id="stats" class="text-[11px] mt-6 opacity-60">Loading...</p><div class="mt-8 flex flex-col gap-2"><button onclick="goPage('all');toggleMenu()" class="text-left px-5 py-3 rounded-full bg-black text-white text-[13px]">All Books</button><button onclick="goPage('fav');toggleMenu()" class="text-left px-5 py-3 rounded-full hover:bg-black/5 text-[13px]">My Fav</button><div class="h-[1px] bg-black/10 my-4"></div><button onclick="fixBluePage()" class="text-left px-5 py-3 rounded-full bg-red-500 text-white text-[11px] tracking-widest">FIX BLUE PAGE (Clear Old)</button><p class="text-[10px] opacity-40 mt-2">Tap this once to remove old tmpfiles books. No need to go to any other site.</p></div></div></div>

<div class="px-6 md:px-10 pt-8"><h1 class="serif text-[46px] leading-[0.9]">Keep the story<br>going..</h1><div id="page-all" class="page active mt-12"><div id="bookRow" class="flex gap-6 overflow-x-auto no-scrollbar pb-8"></div><div id="empty" class="border border-dashed border-black/15 rounded-[20px] p-12 text-center"><p class="serif text-[22px]">Empty</p><p class="text-[11px] opacity-50 mt-2">Upload — will show everywhere, reads inside app</p></div></div>
<div id="page-fav" class="page mt-12"><div id="favRow" class="flex gap-6 flex-wrap"></div></div>
</div>
</div>

<div id="detailPage" class="fixed inset-0 z-[120] hidden bg-[#FFFEF8] overflow-y-auto"><div class="max-w-[1280px] mx-auto min-h-screen"><div class="flex justify-between items-center px-6 md:px-8 py-5 border-b border-black/5"><button onclick="closeDetail()" class="px-5 py-2 rounded-full border text-[11px] tracking-widest">CLOSE</button><p class="text-[11px] tracking-widest opacity-40">BOOK</p><div class="w-[70px]"></div></div><div class="px-6 md:px-16 py-10 flex flex-col md:flex-row gap-10"><div id="detailCover" class="w-[200px] md:w-[320px] h-[300px] md:h-[480px] rounded-[12px] overflow-hidden book-shadow bg-[#eee] shrink-0 mx-auto"></div><div class="flex-1"><h2 id="detailTitle" class="serif text-[32px] md:text-[44px] leading-[1.05]"></h2><div class="mt-10 grid grid-cols-1 gap-3 max-w-[320px]"><button onclick="readInside()" class="w-full py-4 bg-black text-white rounded-full text-[12px] tracking-[0.15em]">READ INSIDE APP</button><button onclick="toggleFavDetail()" id="detailFavBtn" class="py-3 border border-black/10 rounded-full text-[11px] tracking-widest">MY FAV</button><button onclick="deleteDetail()" class="py-3 text-[11px] opacity-40 tracking-widest mt-2">DELETE FOR EVERYONE</button></div></div></div></div></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const SHARED_URL="https://api.npoint.io/d3e5907cd3b2897d1e25";
let books=[], selectedId=null, currentScale=1.2;

async function uploadPDF(file){
  const fd=new FormData(); fd.append('reqtype','fileupload'); fd.append('fileToUpload',file);
  const r=await fetch('https://catbox.moe/user/api.php',{method:'POST',body:fd});
  const url=(await r.text()).trim();
  if(!url.startsWith('https://')) throw new Error(url);
  return url;
}
async function loadBooks(){ const r=await fetch(SHARED_URL); const d=await r.json(); books=Array.isArray(d)?d:[]; books=books.reverse(); document.getElementById('stats').innerText=books.length+' books — Direct read inside'; renderAll(); }
async function saveCloud(){ await fetch(SHARED_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify([...books].reverse())}); }
async function genCover(file){ try{ const buf=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument(buf).promise; const page=await pdf.getPage(1); const vp=page.getViewport({scale:0.4}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise; return c.toDataURL('image/jpeg',0.5);}catch{return null;} }

document.getElementById('pdfInput').addEventListener('change', async e=>{
 const files=Array.from(e.target.files); if(!files.length) return;
 document.getElementById('loader').style.display='flex';
 for(const f of files){ try{ document.getElementById('loaderText').innerText=f.name; const cover=await genCover(f); const pdf_url=await uploadPDF(f); books.unshift({id:Date.now()+'_'+Math.random().toString(36).slice(2), title:f.name.replace('.pdf','').slice(0,60), cover, pdf_url, size:f.size, fav:false}); }catch(err){ alert('Failed '+f.name+': '+err.message);} }
 document.getElementById('loaderText').innerText='Saving...'; await saveCloud(); document.getElementById('loader').style.display='none'; await loadBooks();
});

function renderAll(){ const q=(document.getElementById('searchInput').value||'').toLowerCase(); const filtered=books.filter(b=> b.title.toLowerCase().includes(q)); const row=document.getElementById('bookRow'); row.innerHTML=''; document.getElementById('empty').style.display=filtered.length?'none':'block'; filtered.forEach(b=> row.innerHTML+=card(b)); document.getElementById('favRow').innerHTML=books.filter(b=> b.fav).map(card).join(''); }
function card(b){ const cover=b.cover?`<img src="${b.cover}" class="w-full h-full object-cover">`:`<div class="w-full h-full bg-black text-white p-4 flex items-end"><p>${b.title.slice(0,40)}</p></div>`; return `<div class="min-w-[160px]"><div onclick="openDetail('${b.id}')" class="w-[160px] h-[230px] rounded-[8px] overflow-hidden book-shadow cursor-pointer bg-white">${cover}</div><p class="text-[12px] font-medium truncate w-[160px] mt-3">${b.title}</p></div>`; }
function toggleMenu(){ document.getElementById('menuDrawer').classList.toggle('hidden'); }
function goPage(p){ document.querySelectorAll('.page').forEach(e=>e.classList.remove('active')); document.getElementById('page-'+p).classList.add('active'); }
function openDetail(id){ selectedId=id; const b=books.find(x=>x.id===id); document.getElementById('detailTitle').innerText=b.title; document.getElementById('detailCover').innerHTML=b.cover?`<img src="${b.cover}" class="w-full h-full object-cover">`:`<div class="w-full h-full bg-black text-white p-6 flex items-end"><p>${b.title}</p></div>`; document.getElementById('detailPage').classList.remove('hidden'); }
function closeDetail(){ document.getElementById('detailPage').classList.add('hidden'); }
async function toggleFavDetail(){ const b=books.find(x=>x.id===selectedId); b.fav=!b.fav; await saveCloud(); await loadBooks(); }
async function deleteDetail(){ if(!confirm('Delete for everyone?')) return; books=books.filter(x=>x.id!==selectedId); await saveCloud(); closeDetail(); await loadBooks(); }
async function fixBluePage(){ if(!confirm('This will delete ALL old books with blue page? Then you can re-upload fresh. Continue?')) return; books=[]; await saveCloud(); await loadBooks(); toggleMenu(); alert('Cleared! Now upload new books — they will open inside app, no blue page.'); }

async function readInside(){
 const b=books.find(x=>x.id===selectedId);
 document.getElementById('pdfTitle').innerText=b.title;
 document.getElementById('pdfViewer').style.display='flex';
 document.getElementById('pdfContainer').innerHTML='<p class="text-white/50 text-[11px] tracking-widest">Loading PDF inside...</p>';
 try{
  const pdf=await pdfjsLib.getDocument(b.pdf_url).promise;
  const cont=document.getElementById('pdfContainer'); cont.innerHTML='';
  for(let i=1;i<=pdf.numPages;i++){
   const page=await pdf.getPage(i);
   const vp=page.getViewport({scale:currentScale});
   const canvas=document.createElement('canvas'); canvas.width=vp.width; canvas.height=vp.height; canvas.className='rounded-[8px] shadow-2xl max-w-[95vw]';
   cont.appendChild(canvas);
   await page.render({canvasContext:canvas.getContext('2d'), viewport:vp}).promise;
  }
 }catch(e){ document.getElementById('pdfContainer').innerHTML='<p class="text-white">Failed to load, trying direct open...</p>'; window.open(b.pdf_url,'_blank'); }
}
function closePdf(){ document.getElementById('pdfViewer').style.display='none'; document.getElementById('pdfContainer').innerHTML=''; }
function pdfZoom(d){ currentScale+=d; readInside(); }
document.getElementById('searchInput').addEventListener('input', renderAll);
loadBooks();
</script>
</body>
</html>
